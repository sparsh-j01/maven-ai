name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token; actions SHA-pinned so a moved upstream tag can't run
# new code here. Bump the SHAs (and trailing version comments) to upgrade.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — checkout otherwise leaves GITHUB_TOKEN in
      # .git/config, where any later step (or a compromised dependency) can read it.
      # Neither job pushes, so neither needs it.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # A build-only break (a bad import, a server/client boundary slip) passes
      # lint+typecheck+test but can't ship — so gate it here too. next build
      # prerenders static pages, which need a Clerk publishable key to be resolvable.
      # Write it to apps/web/.env, which is where Next actually looks: locally that
      # path is a symlink to the repo-root .env, but the symlink is gitignored and so
      # doesn't exist on a fresh checkout — a root .env here would never be read.
      # Build-time-only, non-secret dummies; no real auth happens during a build.
      # NEXT_PUBLIC_SITE_URL is written DELIBERATELY BLANK. That is the shape
      # .env.example ships and the shape a half-filled Vercel project has, and it is the
      # one input that separates `??` from `||`: unset, both fall back and the build is
      # green; declared-but-empty, `??` passes "" through to new URL("") and the build
      # dies. CI used to omit the line entirely, so a revert of that fix would have
      # shipped green and only detonated on a real deploy. Now `next build` is the test.
      - name: Build web
        run: |
          printf 'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk\nCLERK_SECRET_KEY=sk_test_ci\nNEXT_PUBLIC_SITE_URL=\n' > apps/web/.env
          pnpm --filter @maven-ai/web build

  # The Python grader is the other half of coding-round correctness and was
  # ungated. These modules are stdlib-only at import, so we skip the heavy voice
  # stack and just run the graders + their contract tests.
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: pip install pytest

      # Every reference solver matches its hand-computed answers (72 cases).
      - run: python coding.py
      - run: python -m pytest -q
